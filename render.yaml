# Render Blueprint: one web service (the agent API plus the static page).
# Deploy steps are in the README.
#
# Free plan, POC scope: the service sleeps after 15 minutes idle, and the
# next request waits for a cold start.
#
# The database is external (Neon free tier, Postgres with pgvector), not a
# Render database: Render allows one free Postgres per workspace, and its
# free databases expire after 30 days.

services:
  - type: web
    name: atlas-rag-agent
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Migrations run in the build because free instances don't get a
    # pre-deploy step. The first migration creates the pgvector extension.
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets are entered in the dashboard when the Blueprint is created,
      # never stored here. The server refuses to start if any is empty.
      # DATABASE_URL is Neon's direct (non-pooled) connection string:
      # prisma migrate doesn't work through the pooler.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false


# Render Blueprint: one web service (the agent API plus the static page)
# and one Postgres instance with pgvector. Deploy steps are in the README.
#
# Free plans, POC scope. Two consequences worth knowing:
#   - The web service sleeps after 15 minutes idle; the next request waits
#     for a cold start.
#   - The free database expires 30 days after creation. Re-create it and
#     re-seed (README, "Deploying").

services:
  - type: web
    name: atlas-rag-agent
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Migrations run in the build because free instances don't get a
    # pre-deploy step. The first migration creates the pgvector extension.
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      # Secrets are entered in the dashboard when the Blueprint is created,
      # never stored here. The server refuses to start if either is empty.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

databases:
  - name: atlas-db
    plan: free
    region: oregon
    databaseName: atlas
    # Matches the local pgvector/pgvector:pg16 container.
    postgresMajorVersion: "16"
